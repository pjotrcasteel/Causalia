name: Publish to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore
        run: dotnet restore Causalia.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build Causalia.slnx -c Release --no-restore -m:1

      - name: Verify documentation
        run: python eng/verify.py

      - name: Test
        run: >-
          dotnet test Causalia.slnx -c Release
          --no-build --no-restore -m:1
          --logger "trx;LogFilePrefix=tests"
          --blame-hang-timeout 2m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-tests-${{ runner.os }}
          path: "**/TestResults/**/*"
          if-no-files-found: warn

      - name: Pack
        if: runner.os == 'Linux'
        run: >-
          dotnet pack Causalia.slnx -c Release
          --no-build --no-restore -m:1
          -o artifacts/packages

      - name: Verify packages and consumer
        if: runner.os == 'Linux'
        run: python eng/verify.py --packages artifacts/packages --consumer

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-packages
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    needs: validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - uses: actions/download-artifact@v4
        with:
          name: nuget-release-packages
          path: packages

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Voeg het repository secret NUGET_API_KEY toe."
            exit 1
          fi

          dotnet nuget push "packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate