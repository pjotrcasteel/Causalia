name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.400
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            NuGet.Config
            **/packages.lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore
        run: dotnet restore Causalia.slnx --locked-mode -m:1

      - name: Build
        run: dotnet build Causalia.slnx --configuration Release --no-restore -m:1

      - name: Verify documentation
        run: python eng/verify.py

      - name: Test
        run: >-
          dotnet test Causalia.slnx --configuration Release --no-build --no-restore -m:1
          --logger "trx;LogFilePrefix=tests" --blame-hang-timeout 2m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}
          path: '**/TestResults/**/*'
          if-no-files-found: warn
          retention-days: 14

      - name: Pack
        if: runner.os == 'Linux'
        run: >-
          dotnet pack Causalia.slnx --configuration Release --no-build --no-restore -m:1
          -p:PackageOutputPath=${{ github.workspace }}/artifacts/packages

      - name: Verify packages and consumer
        if: runner.os == 'Linux'
        run: python eng/verify.py --packages artifacts/packages --consumer

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
